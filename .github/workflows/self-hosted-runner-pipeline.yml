name: Self-Hosted Master-Runner CI/CD Pipeline

on:
  workflow_dispatch:
  # push:
  #   branches: [main, master, staging, 'release/*']

env:
  AZURE_RESOURCE_GROUP: master-node-rg-fresh
  AKS_CLUSTER_NAME: aks-end-to-end-project
  ACR_NAME: endtoendproject
  IMAGE_TAG: ${{ github.sha }}
  K8S_NAMESPACE: production

jobs:
  build-and-deploy-on-runner:
    name: Build and Deploy on Self-Hosted AKS Runner
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Runner Node Environment
        run: |
          set -euxo pipefail
          echo "=== RUNNER NODE SYSTEM TELEMETRY ==="
          hostname
          uname -a
          az version
          docker version || podman version
          kubectl version --client=true
          helm version

      - name: Set AKS kube context
        run: |
          set -euxo pipefail
          az aks get-credentials \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AKS_CLUSTER_NAME }}" \
            --overwrite-existing
          kubectl config current-context
          kubectl get namespace "${{ env.K8S_NAMESPACE }}" >/dev/null 2>&1 || kubectl create namespace "${{ env.K8S_NAMESPACE }}"

      - name: Build and push backend & frontend images to ACR
        run: |
          set -euxo pipefail
          az acr login --name "${{ env.ACR_NAME }}"
          docker build -t "${{ env.ACR_NAME }}.azurecr.io/ai-backend:${{ env.IMAGE_TAG }}" ./BE
          docker build -t "${{ env.ACR_NAME }}.azurecr.io/ai-frontend:${{ env.IMAGE_TAG }}" ./FE
          docker push "${{ env.ACR_NAME }}.azurecr.io/ai-backend:${{ env.IMAGE_TAG }}"
          docker push "${{ env.ACR_NAME }}.azurecr.io/ai-frontend:${{ env.IMAGE_TAG }}"

      - name: Apply Kubernetes manifests to AKS
        run: |
          set -euxo pipefail
          kubectl apply -f ./runner-node-master-node/k8s/00-namespace.yaml
          kubectl apply -f ./runner-node-master-node/k8s/01-configmap-secrets.yaml
          kubectl apply -f ./runner-node-master-node/k8s/02-postgres-database.yaml
          kubectl apply -f ./runner-node-master-node/k8s/03-backend-deployment.yaml
          kubectl apply -f ./runner-node-master-node/k8s/04-frontend-deployment.yaml
          kubectl apply -f ./runner-node-master-node/k8s/05-ingress.yaml
          kubectl apply -f ./runner-node-master-node/k8s/06-backend-hpa.yaml

      - name: Update deployment images to the newly built tag
        run: |
          set -euxo pipefail
          kubectl set image deployment/ai-backend backend-api="${{ env.ACR_NAME }}.azurecr.io/ai-backend:${{ env.IMAGE_TAG }}" -n "${{ env.K8S_NAMESPACE }}"
          kubectl set image deployment/ai-frontend frontend-web="${{ env.ACR_NAME }}.azurecr.io/ai-frontend:${{ env.IMAGE_TAG }}" -n "${{ env.K8S_NAMESPACE }}"

      - name: Rollout Status Verification
        run: |
          set -euxo pipefail
          kubectl rollout status deployment/ai-backend -n "${{ env.K8S_NAMESPACE }}" --timeout=180s
          kubectl rollout status deployment/ai-frontend -n "${{ env.K8S_NAMESPACE }}" --timeout=180s
          kubectl get pods -n "${{ env.K8S_NAMESPACE }}"
          kubectl get svc,ingress -n "${{ env.K8S_NAMESPACE }}"
