name: 3-Tier Enterprise AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

env:
  AZURE_RESOURCE_GROUP: master-node-rg-fresh
  AKS_CLUSTER_NAME: aks-end-to-end-project
  ACR_NAME: endtoendproject
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ==========================================
  # STAGE 1: Code Quality, Linting & Tests
  # ==========================================
  test-and-lint:
    name: Lint & Unit Tests (FE & BE)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/BE
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies & Run Tests
        working-directory: ./BE
        run: |
          pip install -r requirements.txt
          PYTHONPATH="${{ github.workspace }}/BE" pytest tests/ -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./FE/package.json

      - name: Install Frontend Dependencies & Verify Build
        working-directory: ./FE
        run: |
          npm install
          npm run build

  # ==========================================
  # STAGE 2: Security & Vulnerability Scanning
  # ==========================================
  security-scan:
    name: Container & Code Security Scan
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Security Scan Python Dependencies
        run: |
          pip install safety bandit
          bandit -r BE/app -ll || true

      - name: Build Local Images for Scanning
        run: |
          docker build -t ai-backend-scan:local ./BE
          docker build -t ai-frontend-scan:local ./FE

      - name: Run Trivy Vulnerability Scanner on Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ai-backend-scan:local'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # STAGE 3: Build & Push Docker Images to ACR
  # ==========================================
  build-and-push:
    name: Build & Push Docker Images to ACR
    needs: [test-and-lint, security-scan]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Azure CLI is already authenticated on the runner
        run: |
          set -euxo pipefail
          az account show >/dev/null
          az acr login --name "${{ env.ACR_NAME }}" --expose-token > /tmp/acr-token.json
          echo "Azure CLI is authenticated and ACR access is available on this runner."

          ACR_REFRESH_TOKEN="$(python3 - <<'PY'
          import json
          with open('/tmp/acr-token.json', 'r', encoding='utf-8') as fh:
              data = json.load(fh)
          token = data.get('refreshToken') or data.get('accessToken') or ''
          print(token)
          PY
          )"

          if [ -z "$ACR_REFRESH_TOKEN" ]; then
            echo "Failed to read ACR refresh token from az acr login output." >&2
            exit 1
          fi

          printf '%s' "$ACR_REFRESH_TOKEN" | docker login "${{ env.ACR_NAME }}.azurecr.io" --username 00000000-0000-0000-0000-000000000000 --password-stdin

      - name: Build and Tag Backend Image
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/ai-backend:${{ env.IMAGE_TAG }} -t ${{ env.ACR_NAME }}.azurecr.io/ai-backend:latest ./BE

      - name: Build and Tag Frontend Image
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/ai-frontend:${{ env.IMAGE_TAG }} -t ${{ env.ACR_NAME }}.azurecr.io/ai-frontend:latest ./FE

      - name: Push Images to ACR
        run: |
          docker push ${{ env.ACR_NAME }}.azurecr.io/ai-backend:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/ai-backend:latest
          docker push ${{ env.ACR_NAME }}.azurecr.io/ai-frontend:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/ai-frontend:latest

  # ==========================================
  # STAGE 4: Deploy to Azure AKS via Helm
  # ==========================================
  deploy-to-aks:
    name: Deploy 3-Tier Stack to Azure AKS
    needs: build-and-push
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Azure CLI and cluster access on the runner
        run: |
          set -euxo pipefail
          az account show >/dev/null
          az aks get-credentials \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AKS_CLUSTER_NAME }}" \
            --overwrite-existing
          kubectl config current-context

      - name: Deploy Helm Chart to AKS
        run: |
          helm upgrade --install ai-enterprise-stack ./runner-node-master-node/helm/ai-app-chart \
            --namespace production \
            --create-namespace \
            --set backend.image.tag=${{ env.IMAGE_TAG }} \
            --set frontend.image.tag=${{ env.IMAGE_TAG }} \
            --set global.registry=${{ env.ACR_NAME }}.azurecr.io \
            --wait --timeout 5m0s
