services:
  # ==========================================
  # TIER 3: PostgreSQL Database
  # ==========================================
  postgres-db:
    image: postgres:16-alpine
    container_name: ai_postgres_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: SecureLocalPassword123!
      POSTGRES_DB: aidatabase

    ports:
      - "5432:5432"

    volumes:
      - postgres_ai_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dbadmin -d aidatabase" ]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      ai-network:
        aliases:
          - postgres-db
          - postgres-db-service

  # ==========================================
  # TIER 2: FastAPI AI Gateway Backend
  # ==========================================
  ai-backend:
    build:
      context: ./BE
      dockerfile: Dockerfile

    container_name: ai_backend_service
    restart: unless-stopped

    environment:
      ENVIRONMENT: development
      DEBUG: "True"

      DATABASE_URL: postgresql+asyncpg://dbadmin:SecureLocalPassword123!@postgres-db:5432/aidatabase

      DEFAULT_MODEL_ID: google-gemini-flash

      GEMINI_API_KEY: ${GEMINI_API_KEY:-AQ.Ab8RN6JTljnxd3V4sU7qOe30nbr8eiPVlgv4samn3UIaU2EVPQ}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}

      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

    ports:
      - "8000:8000"

    volumes:
      - ./BE/app:/app/app

    depends_on:
      postgres-db:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 3

    networks:
      ai-network:
        aliases:
          - ai-backend
          - ai-backend-service

  # ==========================================
  # TIER 1: React Single-Page Application
  # ==========================================
  ai-frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile

    container_name: ai_frontend_web
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      ai-backend:
        condition: service_healthy

    networks:
      ai-network:
        aliases:
          - ai-frontend
          - ai-frontend-service

# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres_ai_data:
    name: postgres_ai_data

# ==========================================
# NETWORK
# ==========================================
networks:
  ai-network:
    name: ai_tier_network
    driver: bridge
