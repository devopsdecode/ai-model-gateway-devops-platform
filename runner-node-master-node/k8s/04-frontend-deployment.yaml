apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-frontend
  namespace: production
  labels:
    app: ai-frontend
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ai-frontend
      tier: frontend
  template:
    metadata:
      labels:
        app: ai-frontend
        tier: frontend
    spec:
      containers:
      - name: frontend-web
        image: endtoendproject.azurecr.io/ai-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-frontend-service
  namespace: production
  labels:
    app: ai-frontend
    tier: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    app: ai-frontend
    tier: frontend
